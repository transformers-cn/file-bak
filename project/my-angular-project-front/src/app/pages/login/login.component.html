<div class="login-page">
  <div class="login-card">
    <h2 class="login-title">药品管理系统</h2>
    <div class="login-field">
      <label>用户名</label>
      <input class="form-control" type="text" [(ngModel)]="username"
             placeholder="请输入用户名" (keyup.enter)="login()" />
    </div>
    <div class="login-field">
      <label>密码</label>
      <input class="form-control" type="password" [(ngModel)]="password"
             placeholder="请输入密码" (keyup.enter)="login()" />
    </div>
    <div class="field-error" *ngIf="errorMsg">{{ errorMsg }}</div>
    <button class="btn btn-primary login-btn" (click)="login()" [disabled]="loading">
      {{ loading ? '登录中...' : '登 录' }}
    </button>
    <p class="login-hint">Mock 账号：admin / 123456</p>
  </div>
</div>
