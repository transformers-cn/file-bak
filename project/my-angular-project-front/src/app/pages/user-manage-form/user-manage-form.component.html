<div class="modal-mask" (click)="onMaskClick($event)">
  <div class="modal-dialog" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <span class="modal-title">{{ isEdit ? '编辑用户' : '新增用户' }}</span>
      <button class="modal-close" (click)="closed.emit()">×</button>
    </div>

    <div class="modal-body">
      <div class="form-grid">
        <div class="form-item">
          <label class="required">用户名称</label>
          <input class="form-control" type="text" [(ngModel)]="form.name" maxlength="50" />
        </div>
        <div class="form-item">
          <label>年龄</label>
          <input class="form-control" type="number" min="0" [(ngModel)]="form.age" />
        </div>
        <div class="form-item">
          <label>邮件地址</label>
          <input class="form-control" type="text" [(ngModel)]="form.email" />
        </div>
        <div class="form-item">
          <label class="required">用户名（登录用）</label>
          <input class="form-control" type="text" [(ngModel)]="form.loginId" />
        </div>
        <div class="form-item">
          <label class="required">登录密码</label>
          <input class="form-control" type="password" [(ngModel)]="form.loginPassword"/>
        </div>
      </div>
      <div class="field-error" *ngIf="errorMsg">{{ errorMsg }}</div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-primary" (click)="submit()" [disabled]="submitting">
        {{ submitting ? '提交中...' : '确定' }}
      </button>
      <button class="btn" (click)="closed.emit()">取消</button>
    </div>
  </div>
</div>
