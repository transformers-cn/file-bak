server:
  port: 8080

spring:
  datasource:
    # ===== 虚拟配置，请按《如何连接本地MySQL.txt》修改 =====
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/demo_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 1234567890

mybatis-plus:
  configuration:
    # 下划线转驼峰（如 create_time -> createTime）
    map-underscore-to-camel-case: true
    # 控制台打印 SQL，方便学习观察
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    mapper-locations: classpath*:/mapper/**/*.xml
    type-aliases-package: com.example.demo.dto
  global-config:
    db-config:
      id-type: auto
